<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HIKARI — Aurora</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0C13; --card:#12151F; --card2:#161A28; --bord:rgba(255,255,255,.07);
  --txt:#EAEDF6; --dim:#8A92AC; --ind:#6E7BFF; --teal:#35E0C5; --vio:#B06CFF;
  --grad:linear-gradient(90deg,#6E7BFF,#35E0C5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{font-family:'Inter',sans-serif;color:var(--txt);background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(760px 420px at 18% -6%, rgba(110,123,255,.13), transparent 60%),
   radial-gradient(680px 400px at 88% 2%, rgba(53,224,197,.09), transparent 60%),
   radial-gradient(800px 620px at 55% 118%, rgba(176,108,255,.08), transparent 62%)}
.wrap{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding:0 44px 90px}

/* ————— floating nav ————— */
.navbar{position:sticky;top:18px;z-index:50;display:flex;justify-content:center;padding:18px 0 34px}
.pill{display:flex;align-items:center;gap:4px;background:rgba(18,21,31,.72);backdrop-filter:blur(18px);
  border:1px solid var(--bord);border-radius:999px;padding:7px;box-shadow:0 18px 44px -18px rgba(0,0,0,.7)}
.pill .brand{display:flex;align-items:center;gap:9px;padding:8px 18px 8px 12px;font-family:'Sora';font-weight:800;font-size:14px;letter-spacing:.06em}
.pill .brand .dot{width:22px;height:22px;border-radius:7px;background:var(--grad);
  box-shadow:0 0 16px rgba(110,123,255,.6)}
.pill a{padding:9px 17px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--dim);cursor:pointer}
.pill a.on{background:rgba(110,123,255,.14);color:var(--txt);box-shadow:inset 0 0 0 1px rgba(110,123,255,.35)}
.pill a:hover:not(.on){color:var(--txt)}
.pill .sep{width:1px;height:22px;background:var(--bord);margin:0 8px}
.pill .cmdk{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.04);
  border:1px solid var(--bord);color:var(--dim);font-size:12px;min-width:190px}
.pill .cmdk kbd{font-family:'Inter';font-size:10px;background:rgba(255,255,255,.07);padding:2px 7px;border-radius:5px;margin-left:auto}

/* ————— hero ————— */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:430px;display:flex;
  border:1px solid var(--bord);background:var(--card)}
.hero::after{content:"";position:absolute;inset:-1px;border-radius:26px;padding:1px;pointer-events:none;
  background:linear-gradient(120deg,rgba(110,123,255,.55),transparent 30%,transparent 68%,rgba(53,224,197,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,12,19,.96) 22%,rgba(10,12,19,.62) 48%,rgba(10,12,19,.05) 78%)}
.hcontent{position:relative;padding:52px;max-width:560px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hkicker{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.18em;font-weight:600;color:var(--teal)}
.hkicker .live{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.hcontent h2{font-family:'Sora';font-weight:800;font-size:46px;line-height:1.04;letter-spacing:-.015em}
.hcontent .jp{color:var(--dim);font-size:13px;letter-spacing:.3em}
.hmeta{display:flex;gap:9px;flex-wrap:wrap}
.softchip{font-size:11.5px;font-weight:500;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.05);
  border:1px solid var(--bord);color:var(--dim)}
.softchip.hl{background:rgba(53,224,197,.1);border-color:rgba(53,224,197,.35);color:var(--teal)}
.hbtns{display:flex;gap:12px;margin-top:8px}
.abtn{font-family:'Sora';font-size:13px;font-weight:700;padding:13px 26px;border-radius:14px;cursor:pointer;border:none;
  display:inline-flex;align-items:center;gap:9px}
.abtn.go{background:var(--grad);color:#0A0C13;box-shadow:0 10px 30px -8px rgba(110,123,255,.55)}
.abtn.go:hover{filter:brightness(1.1)}
.abtn.gh{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--bord)}

/* ————— sections ————— */
.sh{display:flex;align-items:center;gap:14px;margin:46px 0 18px}
.sh .ic{width:30px;height:30px;border-radius:10px;background:var(--card2);border:1px solid var(--bord);
  display:grid;place-items:center;font-size:13px;color:var(--teal)}
.sh h3{font-family:'Sora';font-weight:700;font-size:17px;letter-spacing:-.01em}
.sh span{font-size:12px;color:var(--dim)}
.sh .more{margin-left:auto;font-size:12px;color:var(--dim);cursor:pointer}
.sh .more:hover{color:var(--teal)}

/* ————— continue cards ————— */
.cw{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cwc{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--bord);cursor:pointer;
  min-height:120px;display:flex;align-items:center;gap:16px;padding:14px 18px 14px 14px;background:var(--card);transition:.22s}
.cwc:hover{transform:translateY(-3px);border-color:rgba(110,123,255,.4);box-shadow:0 20px 40px -20px rgba(110,123,255,.35)}
.cwc .bgi{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.16;filter:blur(14px) saturate(1.2)}
.cwc img.pt{position:relative;width:64px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--bord)}
.cwc .tx{position:relative;flex:1;min-width:0}
.cwc h4{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwc .m{font-size:11px;color:var(--dim);margin-top:4px}
.cwc .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:11px;overflow:hidden}
.cwc .bar i{display:block;height:100%;border-radius:5px;background:var(--grad)}
.cwc .ring{position:relative;flex:0 0 46px}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.09)}
.ring .fg{stroke:url(#agrad);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:600}

/* ————— week strip ————— */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.day{border-radius:16px;border:1px solid var(--bord);background:var(--card);padding:13px 13px 15px;min-height:120px}
.day.today{border-color:transparent;position:relative;background:var(--card2)}
.day.today::after{content:"";position:absolute;inset:-1px;border-radius:16px;padding:1px;pointer-events:none;
  background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.day .dh{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;color:var(--dim);
  font-weight:600;margin-bottom:11px}
.day.today .dh b{color:var(--teal)}
.ep{display:flex;gap:9px;align-items:center;padding:7px;border-radius:10px;cursor:pointer}
.ep:hover{background:rgba(255,255,255,.04)}
.ep img{width:30px;height:40px;object-fit:cover;border-radius:6px}
.ep .t{font-size:10.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .e{font-size:9px;color:var(--dim);margin-top:2px}
.ep .e em{font-style:normal;color:var(--vio);font-weight:600}

/* ————— grid ————— */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:22px 18px}
.pcard{cursor:pointer}
.pc{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--bord);transition:.22s;background:var(--card)}
.pcard:hover .pc{transform:translateY(-5px);box-shadow:0 0 0 1.5px rgba(110,123,255,.6),0 24px 44px -20px rgba(110,123,255,.4)}
.pc img{width:100%;aspect-ratio:2/2.9;object-fit:cover;display:block}
.pc .sc{position:absolute;top:9px;left:9px;font-size:10.5px;font-weight:600;color:var(--txt);
  background:rgba(10,12,19,.66);backdrop-filter:blur(8px);border:1px solid var(--bord);padding:4px 9px;border-radius:8px}
.pc .fv{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  background:rgba(10,12,19,.66);backdrop-filter:blur(8px);border:1px solid rgba(255,194,75,.4);color:#FFC24B;font-size:12px}
.pc .tags{position:absolute;left:9px;bottom:9px;display:flex;gap:6px}
.pc .tg{font-size:9px;font-weight:600;letter-spacing:.08em;padding:4px 8px;border-radius:7px;
  background:rgba(10,12,19,.66);backdrop-filter:blur(8px);border:1px solid var(--bord);color:var(--dim)}
.pc .tg.d{color:var(--vio);border-color:rgba(176,108,255,.4)}
.pc .tg.l{color:var(--teal);border-color:rgba(53,224,197,.4)}
.pc .rg{position:absolute;right:9px;bottom:9px}
.pcard h4{font-size:12.5px;font-weight:600;margin:10px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .m{font-size:10.5px;color:var(--dim);margin:3px 2px 0}
</style>
</head>
<body>
<svg width="0" height="0"><defs><linearGradient id="agrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#6E7BFF"/><stop offset="1" stop-color="#35E0C5"/></linearGradient></defs></svg>

<div class="navbar"><div class="pill">
  <div class="brand"><div class="dot"></div>Hikari</div>
  <a class="on">Library</a><a>Discover</a><a>Airing</a><a>Favourites</a><a>Local</a>
  <div class="sep"></div>
  <div class="cmdk">⌕ Search anything <kbd>Ctrl K</kbd></div>
</div></div>

<div class="wrap">
  <section class="hero">
    <img class="bg" id="heroImg" alt=""><div class="shade"></div>
    <div class="hcontent">
      <span class="hkicker"><span class="live"></span>CONTINUE WATCHING</span>
      <h2 id="heroTitle"></h2>
      <div class="jp" id="heroJp"></div>
      <div class="hmeta" id="heroMeta"></div>
      <div class="hbtns">
        <button class="abtn go">▶ Resume EP 6</button>
        <button class="abtn gh">Details</button>
      </div>
    </div>
  </section>

  <div class="sh"><div class="ic">◔</div><h3>Jump back in</h3><span id="cwN"></span><span class="more">View all →</span></div>
  <div class="cw" id="cw"></div>

  <div class="sh"><div class="ic">◧</div><h3>This week</h3><span id="wkN"></span><span class="more">Full schedule →</span></div>
  <div class="week" id="week"></div>

  <div class="sh"><div class="ic">▦</div><h3>Library</h3><span id="libN"></span><span class="more">Sort: Airdate ↓</span></div>
  <div class="grid" id="grid"></div>
</div>

<script src="data.js"></script>
<script>
const D=window.HIKARI_DATA,$=id=>document.getElementById(id);
const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
$('heroImg').src=D.hero.banner;
$('heroTitle').textContent=D.hero.title;
$('heroJp').textContent=D.hero.native||'';
$('heroMeta').innerHTML=[
 `<span class="softchip hl">★ ${D.hero.score}</span>`,
 `<span class="softchip">${D.hero.format} · ${D.hero.year}</span>`,
 `<span class="softchip">${D.hero.studio||''}</span>`,
 ...D.hero.genres.slice(0,2).map(g=>`<span class="softchip">${g}</span>`),
 D.hero.dub?`<span class="softchip" style="color:var(--vio);border-color:rgba(176,108,255,.35);background:rgba(176,108,255,.08)">EN DUB</span>`:''].join('');
$('cwN').textContent=D.cw.length+' in progress';
const ring=p=>`<span class="ring"><svg width="46" height="46"><circle class="bg" cx="23" cy="23" r="19" fill="none" stroke-width="4"/><circle class="fg" cx="23" cy="23" r="19" fill="none" stroke-width="4" stroke-dasharray="${(p*119.4).toFixed(1)} 119.4"/></svg><b>${Math.round(p*100)}%</b></span>`;
$('cw').innerHTML=D.cw.slice(0,6).map(s=>`<div class="cwc"><div class="bgi" style="background-image:url('${s.banner||s.cover}')"></div>
  <img class="pt" src="${s.cover}"><div class="tx"><h4>${s.title}</h4>
  <div class="m">Next up · EP ${s.watched+1} of ${s.episodes}</div>
  <div class="bar"><i style="width:${Math.round(s.watched/s.episodes*100)}%"></i></div></div>
  ${ring(s.watched/s.episodes)}</div>`).join('');
/* week strip */
const today=new Date().getDay();
const byDay=Array.from({length:7},()=>[]);
D.airing.forEach(a=>{byDay[new Date(a.at*1000).getDay()].push(a)});
$('wkN').textContent=D.airing.length+' episodes scheduled';
$('week').innerHTML=Array.from({length:7},(_,i)=>{
  const d=(today+i)%7;
  return `<div class="day ${i===0?'today':''}"><div class="dh"><b>${i===0?'TODAY':days[d].toUpperCase()}</b><span>${byDay[d].length||''}</span></div>
  ${byDay[d].map(a=>`<div class="ep"><img src="${a.cover}"><div><div class="t">${a.title}</div>
   <div class="e">EP ${a.ep}${a.dub?' · <em>DUB</em>':''}</div></div></div>`).join('')||'<div style="font-size:10px;color:rgba(138,146,172,.4);text-align:center;padding-top:26px">—</div>'}
  </div>`}).join('');
$('libN').textContent=D.stats.shows+' shows';
$('grid').innerHTML=D.grid.map(s=>{const p=s.watched?Math.min(1,s.watched/(s.episodes||12)):0;
 return `<div class="pcard"><div class="pc">
  <img loading="lazy" src="${s.cover}">
  <span class="sc">★ ${s.score||'—'}</span>${s.fav?'<span class="fv">♥</span>':''}
  <span class="tags">${s.dub?'<span class="tg d">DUB</span>':''}${s.local?`<span class="tg l">LOCAL ${s.local}</span>`:''}</span>
  ${p?`<span class="rg">${ring(p)}</span>`:''}
 </div><h4>${s.title}</h4><div class="m">${s.year} · ${s.format} · ${s.genres[0]||''}</div></div>`}).join('');
</script>
</body>
</html>
