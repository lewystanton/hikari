<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HIKARI — Signal</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --night:#070912; --panel:rgba(15,19,38,.66); --line:rgba(120,160,255,.14);
  --txt:#E6EAF7; --dim:#7C86A8;
  --pink:#FF3D8A; --cyan:#2FE6FF; --violet:#8B5CFF; --green:#3DFFA8; --amber:#FFC24B;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--night)}
body{
  font-family:'Space Grotesk',sans-serif;color:var(--txt);min-height:100vh;
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(139,92,255,.16), transparent 55%),
    radial-gradient(800px 480px at 95% 8%, rgba(255,61,138,.13), transparent 55%),
    radial-gradient(700px 600px at 50% 110%, rgba(47,230,255,.08), transparent 60%),
    var(--night);
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px)}
.app{display:grid;grid-template-columns:76px 1fr;min-height:100vh}

/* ————— rail ————— */
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  padding:22px 0;gap:10px;position:sticky;top:0;height:100vh}
.rail .logo{font-family:'DotGothic16';writing-mode:vertical-rl;font-size:21px;letter-spacing:.35em;
  color:var(--pink);text-shadow:0 0 12px rgba(255,61,138,.9),0 0 34px rgba(255,61,138,.45);
  margin-bottom:26px;animation:flick 7s infinite}
@keyframes flick{0%,93%,97%,100%{opacity:1}94%,96%{opacity:.45}}
.ric{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--dim);
  font-size:17px;cursor:pointer;border:1px solid transparent;transition:.2s}
.ric:hover{color:var(--txt)}
.ric.on{color:var(--cyan);border-color:rgba(47,230,255,.4);background:rgba(47,230,255,.07);
  box-shadow:0 0 16px rgba(47,230,255,.25), inset 0 0 12px rgba(47,230,255,.08)}
.rail .gap{flex:1}

/* ————— main ————— */
main{padding:0 44px 90px;max-width:1460px}
.top{display:flex;align-items:center;gap:24px;padding:24px 0}
.top h1{font-family:'Unbounded';font-size:13px;font-weight:700;letter-spacing:.3em}
.top h1 em{font-style:normal;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:6px;margin-left:14px}
.tab{padding:9px 18px;border-radius:999px;font-size:11.5px;letter-spacing:.14em;color:var(--dim);cursor:pointer;border:1px solid transparent}
.tab.on{color:#fff;border-color:rgba(255,61,138,.5);background:rgba(255,61,138,.1);
  box-shadow:0 0 14px rgba(255,61,138,.28), inset 0 0 10px rgba(255,61,138,.08)}
.top .search{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:11px 20px;font-size:12px;color:var(--dim);min-width:250px;backdrop-filter:blur(10px)}

/* ————— hero ————— */
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);min-height:440px;display:flex}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.15) brightness(.85)}
.hero::before{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(7,9,18,.95) 6%,rgba(7,9,18,.55) 44%,rgba(7,9,18,.08) 75%),
             linear-gradient(0deg,rgba(7,9,18,.9),transparent 42%)}
.hglass{position:relative;align-self:flex-end;margin:38px;max-width:620px;padding:34px 36px;border-radius:18px;
  background:rgba(10,13,28,.55);backdrop-filter:blur(18px);border:1px solid rgba(47,230,255,.22);
  box-shadow:0 0 40px rgba(0,0,0,.5), inset 0 0 30px rgba(47,230,255,.03)}
.hglass .np{font-family:'DotGothic16';color:var(--pink);font-size:15px;letter-spacing:.4em;
  text-shadow:0 0 10px rgba(255,61,138,.8);margin-bottom:10px}
.hglass h2{font-family:'Unbounded';font-weight:900;font-size:42px;line-height:1.02;text-transform:uppercase;
  text-shadow:-2px 0 0 rgba(255,61,138,.55), 2px 0 0 rgba(47,230,255,.55);margin-bottom:16px}
.hchips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.chip{font-size:10px;letter-spacing:.2em;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.chip.c{border-color:rgba(47,230,255,.5);color:var(--cyan);box-shadow:0 0 10px rgba(47,230,255,.2)}
.chip.p{border-color:rgba(255,61,138,.5);color:var(--pink);box-shadow:0 0 10px rgba(255,61,138,.2)}
.hbtns{display:flex;gap:12px}
.nbtn{font-family:'Unbounded';font-size:11px;font-weight:700;letter-spacing:.18em;padding:14px 26px;
  border-radius:999px;cursor:pointer;border:none}
.nbtn.go{background:linear-gradient(90deg,var(--pink),var(--violet));color:#fff;
  box-shadow:0 0 24px rgba(255,61,138,.5)}
.nbtn.go:hover{box-shadow:0 0 38px rgba(255,61,138,.8)}
.nbtn.gh{background:transparent;color:var(--cyan);border:1px solid rgba(47,230,255,.5);
  box-shadow:inset 0 0 12px rgba(47,230,255,.1)}

/* ————— section head ————— */
.sh{display:flex;align-items:center;gap:16px;margin:52px 0 20px}
.sh h3{font-family:'Unbounded';font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.sh .jp{font-family:'DotGothic16';font-size:12px;color:var(--dim);letter-spacing:.3em}
.sh .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sh .cnt{font-size:11px;color:var(--dim);letter-spacing:.2em}

/* ————— departure board ————— */
.board{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);backdrop-filter:blur(12px)}
.brow{display:grid;grid-template-columns:64px 1fr 120px 150px 90px;gap:16px;align-items:center;
  padding:14px 24px;border-bottom:1px dashed rgba(120,160,255,.12);font-size:13px}
.brow:last-child{border-bottom:none}
.brow.hd{font-size:9px;letter-spacing:.3em;color:var(--dim);background:rgba(120,160,255,.04)}
.brow .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.brow .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.brow .ttl small{font-family:'DotGothic16';color:var(--dim);margin-left:10px;font-size:11px}
.brow .ep{font-family:'Unbounded';font-size:13px;color:var(--amber);letter-spacing:.1em}
.brow .in{font-variant-numeric:tabular-nums;color:var(--cyan);letter-spacing:.12em;font-weight:700}
.brow .in.now{color:var(--green)}
.dub{font-size:9px;letter-spacing:.2em;color:var(--pink);border:1px solid rgba(255,61,138,.5);
  padding:4px 8px;border-radius:4px;text-align:center;box-shadow:0 0 8px rgba(255,61,138,.15)}

/* ————— continue rail ————— */
.cw{display:flex;gap:20px;overflow-x:auto;padding:4px 2px 16px}
.cw::-webkit-scrollbar{height:5px}.cw::-webkit-scrollbar-thumb{background:rgba(120,160,255,.2);border-radius:4px}
.cwc{flex:0 0 340px;border-radius:16px;overflow:hidden;position:relative;border:1px solid var(--line);
  cursor:pointer;transition:.25s;background:var(--panel)}
.cwc:hover{border-color:rgba(47,230,255,.45);box-shadow:0 0 26px rgba(47,230,255,.2);transform:translateY(-4px)}
.cwc img{width:100%;height:158px;object-fit:cover;display:block;filter:saturate(1.1)}
.cwc .ply{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;
  background:rgba(7,9,18,.6);backdrop-filter:blur(6px);border:1px solid rgba(47,230,255,.6);display:grid;place-items:center;
  color:var(--cyan);font-size:15px;box-shadow:0 0 18px rgba(47,230,255,.35)}
.cwc .inf{padding:13px 16px 15px}
.cwc h4{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwc .m{font-size:10px;color:var(--dim);letter-spacing:.16em;margin-top:4px}
.cwc .bar{height:4px;background:rgba(120,160,255,.14);border-radius:4px;margin-top:10px;overflow:hidden}
.cwc .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));
  box-shadow:0 0 8px rgba(47,230,255,.6);border-radius:4px}

/* ————— grid ————— */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:26px 20px}
.card{cursor:pointer;position:relative}
.pv{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);transition:.25s}
.card:hover .pv{transform:translateY(-6px) scale(1.02)}
.pv img{width:100%;aspect-ratio:2/2.9;object-fit:cover;display:block}
.pv::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,9,18,.72),transparent 45%)}
.pv .sc{position:absolute;left:10px;bottom:10px;font-size:10px;letter-spacing:.1em;color:var(--cyan);
  background:rgba(7,9,18,.65);backdrop-filter:blur(6px);padding:4px 9px;border-radius:6px;border:1px solid rgba(47,230,255,.3);z-index:2}
.pv .fv{position:absolute;top:10px;right:10px;color:var(--amber);font-size:14px;z-index:2;
  text-shadow:0 0 10px rgba(255,194,75,.9)}
.pv .lc{position:absolute;top:10px;left:10px;font-size:8.5px;letter-spacing:.18em;color:var(--green);
  border:1px solid rgba(61,255,168,.5);background:rgba(7,9,18,.6);padding:3px 7px;border-radius:4px;z-index:2}
.pv .db{position:absolute;left:10px;bottom:38px;font-size:8.5px;letter-spacing:.18em;color:var(--pink);
  border:1px solid rgba(255,61,138,.5);background:rgba(7,9,18,.6);padding:3px 7px;border-radius:4px;z-index:2}
.pv .pb{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08);z-index:2}
.pv .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.card h4{font-size:13px;font-weight:500;margin:11px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{font-size:10px;color:var(--dim);letter-spacing:.14em;margin:4px 2px 0}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="logo">ヒカリ</div>
    <div class="ric on" title="Library">▦</div>
    <div class="ric" title="Discover">◈</div>
    <div class="ric" title="Airing">⏻</div>
    <div class="ric" title="Favourites">♥</div>
    <div class="ric" title="Local">⛁</div>
    <div class="gap"></div>
    <div class="ric" title="Settings">⚙</div>
  </aside>
  <main>
    <div class="top">
      <h1>HIKARI <em>// SIGNAL</em></h1>
      <div class="tabs">
        <div class="tab on">ALL</div><div class="tab">AIRING</div><div class="tab">DUBBED</div><div class="tab">UNWATCHED</div><div class="tab">LOCAL</div>
      </div>
      <div class="search">⌕ search — タイトル検索…</div>
    </div>

    <section class="hero">
      <img class="bg" id="heroImg" alt="">
      <div class="hglass">
        <div class="np" id="heroJp"></div>
        <h2 id="heroTitle"></h2>
        <div class="hchips" id="heroChips"></div>
        <div class="hbtns">
          <button class="nbtn go">▶&nbsp; CONTINUE — EP 6</button>
          <button class="nbtn gh">DETAILS</button>
        </div>
      </div>
    </section>

    <div class="sh"><h3>Airing</h3><span class="jp">発車標</span><div class="ln"></div><span class="cnt" id="airCnt"></span></div>
    <div class="board" id="board"></div>

    <div class="sh"><h3>Continue</h3><span class="jp">再開</span><div class="ln"></div></div>
    <div class="cw" id="cw"></div>

    <div class="sh"><h3>Library</h3><span class="jp">全作品</span><div class="ln"></div><span class="cnt" id="libCnt"></span></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script src="data.js"></script>
<script>
const D=window.HIKARI_DATA,$=id=>document.getElementById(id);
const days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
function inStr(at){const s=at*1000-Date.now();if(s<=0)return'NOW';const d=Math.floor(s/86400e3),h=Math.floor(s%86400e3/3600e3),m=Math.floor(s%3600e3/60e3);return d?`${d}D ${String(h).padStart(2,'0')}H`:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}
$('heroImg').src=D.hero.banner;
$('heroJp').textContent=(D.hero.native||'')+' ／ NOW BROADCASTING';
$('heroTitle').textContent=D.hero.title;
$('heroChips').innerHTML=[
  `<span class="chip c">★ ${D.hero.score}</span>`,
  `<span class="chip">${D.hero.format} · ${D.hero.year}</span>`,
  ...D.hero.genres.map(g=>`<span class="chip">${g.toUpperCase()}</span>`),
  D.hero.dub?'<span class="chip p">EN DUB</span>':''].join('');
$('airCnt').textContent=D.airing.length+' SIGNALS LIVE';
$('board').innerHTML='<div class="brow hd"><span></span><span>TITLE</span><span>NEXT EP</span><span>COUNTDOWN</span><span>AUDIO</span></div>'+
 D.airing.map(a=>{const dt=new Date(a.at*1000);
  return `<div class="brow"><span class="dot"></span>
  <span class="ttl">${a.title}<small>${a.native||''}</small></span>
  <span class="ep">EP ${String(a.ep).padStart(2,'0')}</span>
  <span class="in ${a.at*1000<Date.now()?'now':''}">${a.at*1000<Date.now()?'● OUT NOW':days[dt.getDay()]+' '+inStr(a.at)}</span>
  <span>${a.dub?'<span class="dub">DUB</span>':'<span style="font-size:9px;color:var(--dim);letter-spacing:.2em">SUB</span>'}</span></div>`}).join('');
$('cw').innerHTML=D.cw.map(s=>`<div class="cwc"><img src="${s.banner||s.cover}"><div class="ply">▶</div>
  <div class="inf"><h4>${s.title}</h4><div class="m">EP ${s.watched+1} QUEUED · ${s.episodes-s.watched} LEFT</div>
  <div class="bar"><i style="width:${Math.round(s.watched/s.episodes*100)}%"></i></div></div></div>`).join('');
$('libCnt').textContent=D.stats.shows+' TITLES IN ARCHIVE';
$('grid').innerHTML=D.grid.map(s=>`<div class="card">
  <div class="pv" ${s.color?`style="--g:${s.color}"`:''} onmouseover="this.style.boxShadow='0 14px 34px -12px ${s.color||'#2FE6FF'}66'" onmouseout="this.style.boxShadow='none'">
    <img loading="lazy" src="${s.cover}">
    ${s.fav?'<span class="fv">★</span>':''}${s.local?`<span class="lc">LOCAL·${s.local}</span>`:''}
    ${s.dub?'<span class="db">DUB</span>':''}<span class="sc">◈ ${s.score||'—'}</span>
    ${s.watched?`<span class="pb"><i style="width:${Math.min(100,Math.round(s.watched/(s.episodes||12)*100))}%"></i></span>`:''}
  </div>
  <h4>${s.title}</h4><div class="m">${s.year} · ${s.format}${s.genres[0]?' · '+s.genres[0].toUpperCase():''}</div>
</div>`).join('');
</script>
</body>
</html>
